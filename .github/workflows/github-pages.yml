name: Deploy GitHub Pages

on:
  push:
    branches: [main, master, feat/github-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install browser tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Download game release asset
        env:
          GH_TOKEN: ${{ github.token }}
          LITTLE_INFERNO_GAME_URL: ${{ secrets.LITTLE_INFERNO_GAME_URL }}
        run: |
          if [[ -z "$LITTLE_INFERNO_GAME_URL" ]]; then
            mkdir -p local
            gh release download game-data --repo "$GITHUB_REPOSITORY" --pattern littleinferno.zip --dir local
          fi
      - name: Download pinned runtime release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p local
          gh release download game-data --repo "$GITHUB_REPOSITORY" --pattern boxedwine-build-125.zip --dir local
          gh release download game-data --repo "$GITHUB_REPOSITORY" --pattern boxedwine.zip --dir web-boxedwine
      - name: Build verified Pages package
        env:
          LITTLE_INFERNO_GAME_URL: ${{ secrets.LITTLE_INFERNO_GAME_URL }}
        run: |
          npm run build:pages
          npm run verify:pages
      - name: Test launcher and browser isolation
        run: |
          npm test
          npm run test:runtime-download
          npm run test:pages
      - name: Test original game and audio under a project path
        run: npm run test:game:pages -- --smooth --audio
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
